<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>왕초보 영어회화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --orange:#3D9BF5;--orange-d:#1F7FE0;--orange-l:#E8F3FE;--blue:#3D9BF5;
  --cream:#F4F5F7;--cream-2:#ECEEF1;--line:#E6E8EC;
  --green:#2E9B4F;--green-l:#E3F2E2;--red:#E0533A;--red-l:#FCE6E1;
  --ink:#191C20;--sub:#6B7280;--mute:#A0A6B0;--card:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,50,.04),0 4px 14px rgba(20,30,50,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);font-size:17px;line-height:1.5;
  background:#EEF0F3;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{position:relative;max-width:440px;margin:0 auto;height:100dvh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:480px){.app{margin:20px auto;height:calc(100dvh - 40px);border-radius:32px;box-shadow:0 20px 60px rgba(120,70,0,.25)}}
#view{flex:1;min-height:0;overflow-y:auto;padding-bottom:28px}
#view.noTabs{padding-bottom:0}
.pad{padding:20px 20px 0}
/* common */
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--sub)}
.small{font-size:14px}
.card{background:var(--card);border-radius:20px;padding:18px;border:1.5px solid var(--line);margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px 18px;border-radius:18px;font-size:18px;font-weight:800;background:var(--orange);color:#fff;transition:background .15s,transform .08s}
.btn:active{transform:scale(.98);background:var(--orange-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:active{background:var(--cream)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:12px 14px;font-size:16px;border-radius:14px}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--orange-l);color:var(--orange-d)}
.pill.green{background:var(--green-l);color:var(--green)}
.pill.gray{background:var(--cream-2);color:var(--sub)}
.g{color:var(--orange-d);font-weight:800}
.bar{height:12px;border-radius:99px;background:var(--cream-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6CB8FA,var(--orange));transition:width .8s}
.bar.green>i{background:linear-gradient(90deg,#5CC27C,var(--green))}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff}
.iconbtn svg{width:22px;height:22px}
.spk{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--orange-l);color:var(--orange-d);flex:none}
.spk svg{width:22px;height:22px}
.spk.sm{width:36px;height:36px}.spk.sm svg{width:18px;height:18px}
#toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:rgba(31,29,26,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:86%;text-align:center;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;padding:24px 22px 28px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 26px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{width:24px;background:var(--orange)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px;border-radius:18px;background:#fff;border:2px solid var(--line);margin-bottom:10px;font-size:18px;font-weight:700;text-align:left}
.opt.on{border-color:var(--orange);background:#EEF6FF}
.opt .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt.on .chk{background:var(--orange);border-color:var(--orange);color:#fff}
.opt small{display:block;font-size:14px;font-weight:500;color:var(--sub)}
.tag{font-size:12px;font-weight:800;background:var(--green);color:#fff;padding:3px 8px;border-radius:8px;margin-left:6px;vertical-align:2px}
.timeinput{width:100%;padding:16px;border-radius:16px;border:2px solid var(--orange);font-size:22px;font-weight:700;text-align:center;background:#fff;margin-bottom:10px}
.spacer{flex:1}
.note{background:#EEF6FF;border-radius:16px;padding:14px 16px;font-size:15px;color:#2B5C8F}
/* home */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.hero{display:flex;gap:14px;align-items:center;background:var(--orange-l);border-radius:26px;padding:18px;margin-bottom:14px}
.hero .egg{width:96px;flex:none}
.hero .lv{font-size:13px;font-weight:800;color:var(--orange-d)}
.task{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.task:last-child{border-bottom:0}
.task .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--orange-l);color:var(--orange-d);flex:none}
.task.done .num{background:var(--green);color:#fff}
.task.na{opacity:.5}
.task .t{font-weight:800;font-size:17px}
.task .s{font-size:14px;color:var(--sub)}
.task .arr{margin-left:auto;color:var(--mute)}
.week{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week b{display:block;width:100%;max-width:26px;border-radius:7px;background:var(--cream-2);min-height:6px}
.week b.f{background:var(--orange)}
.week span{font-size:12px;color:var(--mute)}
.week .today span{color:var(--orange-d);font-weight:800}
/* settings & onboarding v2 */
.opt:not(.on) .chk svg{opacity:0}
.chk.sq{border-radius:8px}
.rmx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sub);background:var(--cream)}
.rmx svg{width:16px;height:16px}
.addrow{display:flex;gap:8px;align-items:center;margin-top:2px}
.addrow input{flex:1;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);font-size:17px;background:#fff}
.numin{width:70px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);font-size:17px;text-align:center}
.setrow{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #F1F3F5}
.setrow b{display:block;font-size:17px;margin-top:2px}
.chg{display:inline-flex;align-items:center;gap:2px;color:var(--orange-d);font-weight:700;font-size:14px;white-space:nowrap}
.evo2{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:18px}
.evo2>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.evo2 span{font-size:13px;color:var(--sub);font-weight:600}
.evoarr{font-size:26px;color:var(--mute);padding-bottom:40px}
.evo{display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:26px 0 22px;background:#F6FAFF;border:1px solid #E3EEFA;border-radius:18px;padding:16px 6px}
.evoi{display:flex;flex-direction:column;align-items:center;width:58px}
.evoart{width:54px;margin-bottom:6px}
.evoi b{font-size:12px}.evoi span{font-size:11px;color:var(--sub)}
.evoi.next{opacity:.45}
.evoi.cur .evoart{width:62px}
.evoi.cur b{color:var(--orange-d)}
.evoar{color:var(--mute);padding-bottom:34px;font-size:16px}
/* words */
.wcard{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.wcard.empty{opacity:1}
.wcard.empty .wc-t b{color:var(--ink);font-weight:600}
.chhead{display:flex;flex-direction:column;gap:2px;margin:22px 2px 10px}
.chhead span{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--orange-d)}
.chhead b{font-size:17px}
.chhead.fold{width:100%;flex-direction:row;align-items:center;gap:10px;text-align:left;margin:10px 0 8px;padding:14px 14px 14px 16px;border-radius:16px;background:#F4F6F9;color:var(--ink)}
.chhead.fold.open{background:#EEF5FD}
.chhead .cht{flex:1;display:flex;flex-direction:column;gap:2px}
.chhead.fold small{font-size:13px;color:var(--sub);font-weight:600}
.wc-head{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px}
.wc-head .dchip{flex:none;margin-top:2px}
.dchip.on{background:var(--orange-l);color:var(--orange-d)}
.wc-t{flex:1;display:flex;flex-direction:column;min-width:0}
.wc-t b{font-size:16px}
.wc-meta{font-size:12px;color:var(--mute);margin-top:4px}
.wc-meta em,.sstat em{font-style:normal;color:var(--red);font-weight:700}
.wc-chev{color:var(--mute);transition:transform .15s;margin-top:4px}
.wc-chev svg{width:18px;height:18px}
.wc-chev.open{transform:rotate(90deg)}
.wc-body{padding:0 16px 14px;border-top:1px solid #F1F3F5;padding-top:12px}
.sstat{font-size:12px;color:var(--mute);margin-top:2px}
.sent.weak .e{color:var(--red)}
/* status bar */
/* quiz v4 */
.prompt.q2{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,#F1F7FE,#F8FBFF);border:1px solid #E1EDFA;border-radius:22px;padding:20px 22px 22px}
.prompt.q2 .ko{font-size:30px;font-weight:800;color:#14213D;margin-top:12px;position:relative;z-index:1}
.prompt.q2 .en{text-align:left;margin-top:12px;position:relative;z-index:1}
.prompt.q2>div,.prompt.q2 .hintbtn{position:relative;z-index:1}
.qdeco{position:absolute;right:-28px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:#E3EFFC;opacity:.8}
.qdeco:before,.qdeco:after{content:'';position:absolute;width:5px;height:18px;border-radius:4px;background:#D4E6FA;top:-26px}
.qdeco:before{left:30px;transform:rotate(-25deg)}.qdeco:after{left:52px;transform:rotate(15deg)}
.qpill{display:inline-block;font-size:13px;font-weight:700;color:var(--orange-d);background:#E1EFFD;padding:4px 12px;border-radius:999px}
.qpill.green{color:#22874A;background:#E2F4E8}
.hintbtn{display:inline-flex;align-items:center;gap:6px}
.micwrap{width:132px;height:132px;margin:10px auto 6px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#E3F0FD 55%,#F2F8FE 56%,#F2F8FE 70%,transparent 71%)}
.micwrap .mic{margin:0}
.anscard{background:#F7FAFC;border:1px solid #E9EEF3;border-radius:20px;padding:14px 18px 16px;margin-top:10px}
.anscard .livebox{border:0;background:none;padding:10px 0 0;justify-content:flex-start;text-align:left;font-size:26px;font-weight:800;color:#14213D;min-height:44px}
.anscard .ans{border:0;background:none;padding:10px 0 0;font-size:22px;font-weight:700}
.anscard .ans:focus{border:0}
.chips{margin-top:6px}
/* done v2 */
.donewrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:80px 24px 28px;text-align:center}
.flame{width:96px;height:96px;border-radius:50%;background:#FFF3E3;display:grid;place-items:center;color:#FF8A1F;transform:scale(.9);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.flame svg{width:52px;height:52px}
.donewrap.go .flame{transform:scale(1.08)}
.scnt{position:relative;height:84px;width:160px;overflow:hidden;margin-top:18px}
.scnt span{position:absolute;left:0;right:0;font-size:72px;font-weight:900;line-height:84px;letter-spacing:-.03em;transition:transform .55s cubic-bezier(.4,1.3,.5,1),opacity .4s}
.scnt .old{color:var(--mute);transform:translateY(0)}
.scnt .new{color:#FF8A1F;transform:translateY(100%);opacity:0}
.donewrap.go .scnt .old{transform:translateY(-100%);opacity:0}
.donewrap.go .scnt .new{transform:translateY(0);opacity:1}
.cntlbl{font-size:18px;font-weight:700;color:var(--sub)}
.donemsg{margin-top:36px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(6px);transition:all .4s .45s}
.donewrap.go .donemsg{opacity:1;transform:none}
.donemsg b{font-size:22px}
.donemsg span{font-size:15px;color:var(--sub)}
/* quiz v5 */
.hintwrap{opacity:0;animation:hintIn .4s ease 6s forwards}
@keyframes hintIn{to{opacity:1}}
.hintlink{font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
/* quiz v6 */
.prompt.q2 .ko.sm{font-size:22px}
.qtag.again{color:var(--red)}
.qa{display:flex;gap:10px;align-items:flex-start;margin-top:12px;position:relative;z-index:1}
.qa .who{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.qa .e{font-size:18px;font-weight:700;color:#14213D}.qa .k{font-size:14px;color:var(--sub)}
.qa .spk{margin-left:auto}
.shadow{position:relative;z-index:1;margin-top:12px}
.shadow .en{font-size:26px;font-weight:800;line-height:1.3;color:#14213D}
.shadow .k{font-size:16px;color:var(--sub);margin-top:6px}
.bottombar{position:sticky;bottom:0;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 30%)}
/* quiz v7 */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px;position:relative;z-index:1}
.cb{max-width:82%;padding:12px 14px;border-radius:18px;position:relative}
.cb.left{align-self:flex-start;background:#fff;border:1px solid #E3EAF2;border-bottom-left-radius:6px;padding-right:44px}
.cb.right{align-self:flex-end;background:#3D9BF5;color:#fff;border-bottom-right-radius:6px;text-align:left}
.cb .e{font-size:17px;font-weight:700;line-height:1.35}
.cb.left .e{color:#14213D}.cb .k{font-size:13px;opacity:.75;margin-top:2px}
.cb.right .e .g{color:#fff;text-decoration:underline;text-underline-offset:3px}
.cb .lbl{font-size:12px;opacity:.85;font-weight:600}
.cb .kk{font-size:19px;font-weight:700;margin-top:2px}
.cbspk{position:absolute;right:8px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--orange-l);color:var(--orange-d)}
.cbspk svg{width:16px;height:16px}
.qpill.warn{color:#C2610C;background:#FFF0E0}
.anscard.ok{background:#F1FAF4;border-color:#CDEBD7}
.anscard.no{background:#FFF8F1;border-color:#F6DEC6}
.livebox.done{justify-content:space-between;gap:10px;font-size:22px}
.livebox.done .mine{font-size:20px;font-weight:700}
.livebox.done .right{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:18px;font-weight:700}
.mic.dis{opacity:.35;pointer-events:none}
/* quiz v3 */
.qtag{text-align:right;font-size:12px;font-weight:600;color:var(--mute);margin:8px 4px 0}
.hintbtn{font-size:14px;font-weight:600;color:var(--orange-d);background:var(--orange-l);padding:7px 14px;border-radius:999px}
.livebox{min-height:56px;margin:4px 0 0;padding:14px 16px;border-radius:16px;border:1.5px dashed var(--line);background:#FAFBFC;font-size:20px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
.livebox .ph{font-size:14px;font-weight:500;color:var(--mute)}
.skipall{display:block;margin:28px auto 8px;font-size:12px;color:var(--mute);border:1px dashed #D5D9DF;padding:6px 12px;border-radius:999px}
/* words v2 */
.stepchips{display:flex;flex-wrap:wrap;gap:6px}
.stepchips span{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--sub);background:#F4F6F8;padding:5px 10px 5px 5px;border-radius:999px}
.stepchips i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--orange-l);color:var(--orange-d);display:grid;place-items:center;font-size:11px;font-weight:700}
.stepchips .first i{background:var(--orange);color:#fff}
.wsum2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.wsum2>div{background:#F6F8FA;border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:3px}
.wsum2 b{font-size:22px}.wsum2 span{color:var(--sub);font-size:14px}
.wsum2 small{width:100%;font-size:11px;color:var(--sub);white-space:nowrap}
/* record v2 */
.tray.lt{grid-template-columns:30px repeat(7,minmax(0,1fr));gap:6px;padding:10px 10px 10px 4px;border-radius:16px}
.tray.lt.big{grid-template-columns:38px repeat(7,minmax(0,1fr));gap:8px}
.traylbl.lt{grid-template-columns:30px repeat(7,minmax(0,1fr));padding:6px 10px 0 4px}
.traylbl.lt.big{grid-template-columns:38px repeat(7,minmax(0,1fr));gap:8px;padding:0 10px 6px 4px}
.rl{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:4px;line-height:1.15}
.rl b{font-size:11px;color:var(--sub);font-weight:700}
.rl small{font-size:10px;color:var(--mute)}

.traywrap{display:flex;gap:8px;align-items:flex-start}
.trayside{display:flex;flex-direction:column;gap:6px;padding:10px 0;width:30px;flex:none}
.trayside span{display:flex;flex-direction:column;justify-content:center;font-size:11px;color:var(--sub);font-weight:600;line-height:1.2}
.traywrap.big .trayside{width:38px}
.traywrap.big .trayside small{font-size:10px;color:var(--mute);font-weight:500}
.traylbl.top{padding:0 10px 6px}
.cup.out{background:transparent}
.wiggle{animation:wig 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wig{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-6deg)}72%{transform:rotate(5deg)}78%{transform:rotate(-3deg)}84%{transform:rotate(2deg)}90%{transform:rotate(0)}}
.lvlink{display:inline-flex;align-items:center;gap:2px;margin-top:6px;font-size:13px;font-weight:700;color:var(--orange-d);background:var(--orange-l);padding:6px 12px;border-radius:999px}
.totrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.totrow>div{background:#F6F8FA;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.totrow b{font-size:18px;margin-top:2px}
.wkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F1F3F5}
.wkrow:last-child{border-bottom:0}
.wkdate{display:flex;flex-direction:column;width:96px;flex:none;font-size:14px}
.wkdate small,.wktime small{font-size:12px;color:var(--mute)}
.wkbar2{flex:1;height:6px;border-radius:9px;background:#EEF1F5;overflow:hidden}
.wkbar2 i{display:block;height:100%;background:var(--orange);border-radius:9px}
.wktime{display:flex;flex-direction:column;align-items:flex-end;width:74px;flex:none;font-size:14px}
/* egg tray v3 */
.rechead{display:flex;align-items:center;gap:12px;width:100%;color:var(--ink)}
.rechead b{display:block;font-size:19px;font-weight:800}
.rechead small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.rechead>svg{color:var(--mute)}
.rhart{position:relative;width:46px;flex:none}
.rhart i{position:absolute;width:3px;height:8px;border-radius:3px;background:#F7C33C}
.rhart .rs1{right:-4px;top:2px;transform:rotate(30deg)}.rhart .rs2{right:-9px;top:12px;transform:rotate(70deg)}
.etray{display:grid;grid-template-columns:42px repeat(7,minmax(0,1fr));gap:10px 6px;align-items:center;background:#F4F7FC;border:1px solid #E8EEF7;border-radius:22px;padding:16px 12px 12px;box-shadow:0 6px 20px rgba(40,70,120,.05)}
.mpill{font-size:12px;font-weight:800;color:#7C88A0;background:#E8EEF8;border-radius:999px;padding:5px 0;text-align:center}
.mpill.none{background:none}

.hhead{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 0 16px}
.iconbtn.plain{width:40px;height:40px;background:var(--cream);border-radius:12px}
.sumcard{display:flex;gap:12px;align-items:flex-end;background:#F2F8FE;border:1px solid #E2EEFB;border-radius:18px;padding:18px}
.sumnum{font-size:18px;color:var(--sub);margin:4px 0 10px}.sumnum b{font-size:26px;color:var(--ink);font-weight:800}
.sumside{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.streakbtn{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--sub)}
.streakbtn svg{width:16px;height:16px;color:var(--orange)}
.softbtn{background:var(--orange-l);color:var(--orange-d);font-weight:700;font-size:15px;padding:10px 16px;border-radius:999px;white-space:nowrap}
.softbtn.off{background:var(--cream);color:var(--mute)}
.bar.thin{height:6px;background:#E3E8EF}.bar.thin>i{background:var(--orange)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.sechead b{font-size:18px}
.sechead button{display:inline-flex;align-items:center;gap:2px;color:var(--sub);font-size:15px}
.sechead svg{width:16px;height:16px}
.ucard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.ucard.cur{border-color:#D5E7FB;box-shadow:0 4px 20px rgba(30,80,140,.06)}
.ucard.sm{display:flex;align-items:center}
.uc-head{padding:18px 18px 14px;flex:1;min-width:0}
.ucard.cur .uc-head{background:linear-gradient(180deg,#F4F9FF,#fff)}
.dchip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--cream);color:var(--sub)}
.ucard.cur .dchip{background:var(--orange-l);color:var(--orange-d)}
.dnum{font-size:12px;color:var(--mute);font-weight:600}
.uc-title{font-size:18px;font-weight:700;margin-top:10px;letter-spacing:-.01em}
.uc-pat{font-size:16px;font-weight:600;margin-top:4px;color:var(--ink)}
.uc-mean{font-size:14px;color:var(--sub);margin-top:2px}
.ucard.sm .uc-title{font-size:17px}.ucard.sm .uc-pat{font-size:15px;color:var(--sub)}
.uc-side{display:flex;align-items:center;gap:6px;padding-right:14px;color:var(--mute)}
.ubadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--mute);background:var(--cream);padding:5px 9px;border-radius:999px}
.ubadge svg{width:12px;height:12px}
.ubadge.done{color:var(--orange-d);background:var(--orange-l)}
.lockcard{opacity:.7}
.srows{border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 18px;border-bottom:1px solid #F1F3F5}
.srow.cur{background:#F2F8FE}
.snum{font-size:14px;font-weight:600;color:var(--mute);width:22px}
.srow.cur .snum{color:var(--orange-d)}
.sic{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--sub);display:grid;place-items:center;flex:none}
.srow.cur .sic,.srow.done .sic{background:#E6F1FD;color:var(--orange-d)}
.stx{flex:1;display:flex;flex-direction:column;min-width:0}
.stx b{font-size:16px;font-weight:700}.srow.cur .stx b{color:var(--orange-d)}
.stx span{font-size:13px;color:var(--sub)}
.srow.locked .stx b{color:var(--sub)}
.smark{width:24px;height:24px;border-radius:50%;border:1.5px solid #D7DCE2;display:grid;place-items:center;flex:none}
.smark.done{background:var(--orange);border-color:var(--orange);color:#fff}
.smark.done svg{width:13px;height:13px}
.smark.cur{background:var(--orange);border-color:var(--orange);color:#fff}
.uc-foot{display:flex;align-items:center;gap:12px;padding:14px 18px 16px}
/* course path */
.topbar{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:6px;padding:12px 14px 10px;border-bottom:1.5px solid var(--line)}
.tstat{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:12px;color:var(--sub);font-size:15px}
.tstat b{color:var(--ink);font-weight:800}
.tstat svg{color:#FF9A3C}
.tstat:nth-child(3) svg{color:var(--sub)}
.tstat.review{margin-left:auto;background:var(--cream);font-weight:700}
.tstat.review.on{background:var(--orange);color:#fff}.tstat.review.on b{color:#fff}
.bannerwrap{position:sticky;top:63px;z-index:15;padding:12px 16px 4px;background:linear-gradient(#fff 80%,rgba(255,255,255,0))}
.banner{display:flex;align-items:center;gap:12px;background:var(--orange);color:#fff;border-radius:18px;padding:14px 6px 14px 18px}
.banner.locked{background:#AEB4BD}
.bsec{font-size:13px;font-weight:800;opacity:.85;letter-spacing:.02em}
.btitle{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.25}
.bsub{font-size:15px;opacity:.92;font-weight:600}
.bside{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 12px;border-left:1.5px solid rgba(255,255,255,.35);color:#fff;font-size:12px;font-weight:800}
.subhead{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.tstat.link2{background:var(--cream);border-radius:12px}
.path{padding:6px 0 10px}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 0 26px}
.udiv{display:flex;align-items:center;gap:10px;width:100%;padding:14px 22px 10px;color:var(--mute);font-weight:700;font-size:14px}
.udiv:before,.udiv:after{content:'';flex:1;height:2px;background:var(--line)}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center;margin:14px 0 6px}
.node{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--orange);box-shadow:0 3px 0 #2B86DE;transition:transform .08s}
.node:active{transform:scale(.96)}
.node.done{background:#8CC6FA;box-shadow:0 3px 0 #6AAEF0}
.node.locked{background:#ECEEF1;color:#B4B9C1;box-shadow:0 3px 0 #DDE0E5}
.node.cur:before{content:'';position:absolute;inset:-9px;border-radius:50%;border:4px solid #D6E9FD;z-index:-1}
.nchk{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--orange);display:grid;place-items:center;border:1.5px solid var(--line)}
.nlabel{margin-top:14px;font-size:14px;font-weight:800;color:var(--mute)}
.nlabel.cur{color:var(--orange-d)}.nlabel.done{color:var(--sub)}
.startbub{position:absolute;bottom:calc(100% + 10px);white-space:nowrap;background:#fff;border:2px solid var(--line);color:var(--orange-d);font-weight:900;padding:8px 14px;border-radius:14px;animation:bob 1.4s ease-in-out infinite;z-index:2}
.startbub:after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mascot{position:absolute;top:110px;width:96px;text-align:center}
.mascot.right{right:22px}.mascot.left{left:22px}
.mbub{font-size:13px;font-weight:800;color:var(--sub);margin-top:4px}
.trophy{width:96px;height:96px;border-radius:50%;background:var(--cream);border:3px dashed var(--line);padding:8px;filter:grayscale(.6);opacity:.8}
/* flow */
.fwrap{position:sticky;top:0;background:#fff;z-index:5}
.fhead{display:flex;align-items:center;gap:12px;padding:16px 18px 6px;background:#fff}
.fhead .bar{flex:1}
.fhead .cnt{font-size:14px;color:var(--sub);font-weight:700;min-width:40px;text-align:right}
.stepchip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--orange-l);color:var(--orange-d);font-weight:800;font-size:15px}
.stepchip em{font-style:normal;font-weight:600;opacity:.92}
.prompt{background:#fff;border-radius:24px;padding:24px 20px;border:1.5px solid var(--line);margin:16px 0;text-align:center}
.prompt .ko{font-size:24px;font-weight:700;color:#3A3F47;letter-spacing:-.02em}
.prompt .en{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.blank{display:inline-block;min-width:96px;border-bottom:4px solid var(--orange);color:var(--orange-d);margin:0 4px}
.hint{font-size:28px;font-weight:800;letter-spacing:.06em;font-family:ui-monospace,Menlo,monospace}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{padding:18px 10px;border-radius:18px;background:#fff;border:1.5px solid var(--line);font-size:20px;font-weight:800}
.chip.ok{background:var(--green-l);border-color:var(--green);color:var(--green)}
.chip.no{background:var(--red-l);border-color:var(--red);color:var(--red)}
.ans{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:600;outline:none}
.ans:focus{border-color:var(--orange)}
.mic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:6px auto 8px;background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(61,155,245,.3)}
.mic svg{width:40px;height:40px}
.mic.on{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,83,58,.4)}70%{box-shadow:0 0 0 22px rgba(224,83,58,0)}100%{box-shadow:0 0 0 0 rgba(224,83,58,0)}}
.miclbl{text-align:center;font-size:15px;color:var(--sub);font-weight:600}
.live{min-height:30px;text-align:center;font-size:19px;font-weight:700;color:var(--ink);margin:6px 0}
.link{color:var(--sub);font-size:15px;text-decoration:underline;text-underline-offset:3px;display:block;margin:10px auto 0}
.fb{border-radius:22px;padding:18px;margin-top:14px}
.fb.ok{background:var(--green-l)}
.fb.no{background:#F3F7FC}
.fb .ttl{font-weight:800;font-size:19px;margin-bottom:6px}
.fb.ok .ttl{color:var(--green)}
.fb.no .ttl{color:var(--orange-d)}
.fb .ansline{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px;margin:6px 0}
.w-ok{color:var(--green)}.w-no{color:var(--red);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-size:14px;font-weight:700;color:var(--sub)}
.bubble{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-bottom:14px}
.bubble .who{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--orange);flex:none}
.bubble .who.b{background:var(--green)}
.bubble .msg{background:var(--cream);border-radius:4px 18px 18px 18px;padding:12px 14px;flex:1}
.bubble .msg .e{font-size:20px;font-weight:800;line-height:1.3}
.bubble .msg .k{font-size:15px;color:var(--sub)}
.excard{background:#fff;border-radius:26px;padding:34px 20px 26px;border:1.5px solid var(--line);text-align:center;margin:16px 0}
.excard .n{width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;font-weight:900;font-size:20px;display:grid;place-items:center;margin:0 auto 18px}
.excard .en{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.25}
.excard .ko{font-size:21px;color:#3A3F47;margin-top:10px}
.patt{display:inline-flex;gap:8px;align-items:center;background:var(--orange-l);padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px}
.lect{background:#191C20;color:#fff;border-radius:22px;overflow:hidden;margin:16px 0}
.lect .thumb{aspect-ratio:16/9;background:#5AADF7;display:grid;place-items:center;position:relative}
.lect .thumb .play{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--orange-d)}
.lect .thumb .cap{position:absolute;left:16px;top:14px;font-weight:900;color:#fff;font-size:15px;background:rgba(0,0,0,.2);padding:4px 10px;border-radius:8px}
.lect .thumb .big{position:absolute;bottom:14px;left:16px;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.lect .meta{padding:14px 16px}
.mine textarea{width:100%;min-height:62px;margin-bottom:12px;padding:14px;border-radius:16px;border:2px solid var(--line);font-size:19px;font-weight:600;resize:none;outline:none;background:#fff}
.mine textarea:focus{border-color:var(--orange)}
.mine .res{font-size:14px;margin:6px 4px 14px;font-weight:600}
.mine .res.ok{color:var(--green)}.mine .res.warn{color:var(--orange-d)}.mine .res.err{color:var(--red)}
.place{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.place button{padding:8px 12px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:15px;font-weight:700}
/* done */
.celebrate{text-align:center;padding:28px 20px 10px;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{background:#fff;border-radius:18px;padding:14px 6px;text-align:center;border:1.5px solid var(--line)}
.stats b{display:block;font-size:26px;font-weight:900;color:var(--orange-d)}
.stats span{font-size:13px;color:var(--sub);font-weight:700}
.streak{display:flex;align-items:center;justify-content:center;gap:8px;background:#E8F3FE;border-radius:16px;padding:12px;font-weight:800;color:var(--orange-d);font-size:18px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.wobble{}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
/* tray */
.tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;background:#EEF0F3;padding:12px;border-radius:18px}
.cup{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 60%,#DCE0E6,#E6E9EE 70%);display:grid;place-items:center;position:relative}
.cup.fut{background:#F1F3F6;opacity:.65}
.cup .e{width:70%;height:88%;border-radius:50% 50% 48% 48%/58% 58% 42% 42%}
.cup.part .e{background:radial-gradient(circle at 35% 28%,#FFFDF6,#F4E4C4 58%,#DCC394);box-shadow:0 2px 3px rgba(80,60,20,.18)}
.cup.full .e{background:radial-gradient(circle at 35% 28%,#FFF7D6,#FFD26A 55%,#F0A928);box-shadow:0 2px 3px rgba(120,80,0,.2)}
.cup.today{outline:3px solid var(--orange);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:14px;border-radius:50%;margin-right:5px;vertical-align:-2px}
.srs{display:flex;gap:5px;margin:8px 0}
.srs i{flex:1;height:8px;border-radius:9px;background:var(--cream-2)}
.srs i.f{background:var(--orange)}
.srs i.n{background:#A9D2FB}
.sent{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.sent:last-child{border-bottom:0}
.sent .e{font-weight:800;font-size:17px}
.sent .k{font-size:14px;color:var(--sub)}
.lock{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:var(--cream-2);color:var(--mute);margin-bottom:10px;font-weight:700}
.set label{display:block;font-weight:800;margin:18px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:15px}
.seg button.on{border-color:var(--orange);background:#EEF6FF;color:var(--orange-d)}
.demo{border:2px dashed #C9CED6;background:#F8F9FB}
/* ===== 100일 여정 (맵) ===== */
.journey{position:relative;margin:0 auto;max-width:360px}
.journey>svg{position:absolute;inset:0;overflow:visible}
/* 지점 버튼 — 아래쪽 두께(그림자)로 입체감 */
.jstop{position:absolute;transform:translate(-50%,-50%);width:58px;height:54px;border-radius:50%;font-weight:800;font-size:18px;display:grid;place-items:center;z-index:2;
  background:#EEF1F5;color:#A5AFBC;box-shadow:0 6px 0 #D2D9E2,0 10px 14px rgba(40,60,90,.10);transition:transform .08s,box-shadow .08s}
.jstop:active{transform:translate(-50%,calc(-50% + 4px));box-shadow:0 2px 0 #D2D9E2}
.jstop svg{width:24px;height:24px}
.jstop.done{background:var(--mc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--mc) 72%,#000),0 10px 14px rgba(40,60,90,.14)}
.jstop.done:active{box-shadow:0 2px 0 color-mix(in srgb,var(--mc) 72%,#000)}
.jstop.cur{width:68px;height:63px;background:#fff;color:var(--mc);font-size:21px;border:4px solid var(--mc);box-shadow:0 7px 0 color-mix(in srgb,var(--mc) 55%,#fff),0 0 0 9px color-mix(in srgb,var(--mc) 16%,transparent),0 12px 18px rgba(40,60,90,.14)}
.jstop.flag{border-radius:20px;width:64px;height:58px}
.jstop.flag.done{background:#F2B53B;box-shadow:0 6px 0 #C98E12,0 10px 14px rgba(40,60,90,.14)}
.jtip{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:8px 13px;border-radius:12px;animation:jbob 1.6s ease-in-out infinite}
.jtip::after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.jtip.soft{background:#fff;color:var(--ink);border:1px solid var(--line)}.jtip.soft::after{border-top-color:#fff}
@keyframes jbob{50%{transform:translate(-50%,-4px)}}
/* 길 옆에 떨어진 응원의 쪽지 (언제든 열기) */
.jnote{position:absolute;transform:translate(-50%,-50%) rotate(-9deg);display:flex;flex-direction:column;align-items:center;gap:7px;z-index:1}
.jnote .paper{position:relative;width:50px;height:58px;border-radius:2px 12px 2px 2px;background:#FFFDF6;background-image:repeating-linear-gradient(transparent 0 10px,#EFE4C6 10px 11px);background-position:0 16px;box-shadow:1px 4px 9px rgba(90,70,30,.20)}
.jnote .paper i{position:absolute;left:50%;top:-6px;width:28px;height:11px;margin-left:-14px;background:rgba(242,181,59,.55);transform:rotate(4deg)}
.jnote .paper em{position:absolute;right:6px;bottom:4px;font-style:normal;font-size:13px;color:#E0567A}
.jnote small{font-size:12px;font-weight:700;color:#8A6A2B;transform:rotate(9deg);white-space:nowrap}
.jnote.new .paper::after{content:'';position:absolute;top:-6px;right:-6px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff}
.jstop.talk{border-radius:18px;width:62px;height:56px}
.jstop.talk.cur{width:68px;height:62px;border-style:solid}
.jstop.talk.ready{background:#fff;color:var(--mc);border:3px dashed var(--mc);box-shadow:0 6px 0 color-mix(in srgb,var(--mc) 40%,#fff)}
.jcap{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:var(--sub)}
/* 홈 상단 */
.goalline{width:100%;text-align:left;color:var(--ink);display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #E1EDFA;border-radius:12px;background:#fff;margin-bottom:14px}
.goalline .gtag{flex:none;font-size:11px;padding:3px 8px}
.goalline svg{flex:none;color:var(--mute)}
.goalline b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.chap{position:relative}
.chaphead{position:sticky;top:8px;z-index:6;display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px;padding:12px 12px 12px 16px;border-radius:16px;background:color-mix(in srgb,var(--mc) 12%,#F4F6F9);box-shadow:0 4px 12px rgba(30,50,80,.06)}
.chaphead b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.chaphead small{font-size:13px;color:var(--sub)}
.chaphead .tocbtn{background:#fff}
.jstop.cur{z-index:4}
/* 둥지 */
.jstop.nest,.jstop.nest.done,.jstop.nest.cur,.jstop.nest.flag{width:104px;height:76px;border:0;border-radius:0;background:none;box-shadow:none;display:block;padding:0}
.jstop.nest:active{transform:translate(-50%,calc(-50% + 3px));box-shadow:none}
.jstop.nest svg{width:100px;height:72px;display:block;margin:0 auto;overflow:visible}
.jstop.nest.empty svg{opacity:.5;filter:grayscale(.5)}

<script>
/* =========================================================
   설정 — 실제 서비스에 맞게 바꿔 쓰세요
   ========================================================= */
const CONFIG = {
  fakeMic: true,                  // true: 마이크 권한 없이 '말한 것처럼' 시연 (실서비스에선 false)
  lectureUrl: day => '#',          // 예: day => `https://your-class.com/lecture/${day}`
  nextCourse: '가브리엘의 잉글리시 다이어리',
  totalExpressions: 100,          // 병아리가 깨어나는 표현 수 (표현 1개 = 예문 여러 개)
};

/* =========================================================
   100일 여정 — 10일(표현 10개)마다 맵 1개, 맵 10개 = 표현 100개
   · 맵 중간(5일차 뒤)에 가브리엘 쌤의 쪽지
   · 8일차 뒤에 함께 걷는 사람들의 응원 메시지
   · 10일차: 배운 표현 직접 활용하기 + 틀린 문장 다시 보기 → 맵 정복
   ========================================================= */
const MAP_SIZE = 10, MAP_COUNT = 10;
const NOTE_AFTER = 5;
const MAPS = [
  { name: '출발 마을', color: '#5BB0F7' }, { name: '바람 언덕', color: '#4FC1A6' },

  { name: '구름 다리', color: '#7FB8E8' }, { name: '노을 협곡', color: '#F08A5D' },

];
/* 가브리엘 쌤의 쪽지 (맵마다 1개 — 실제 문구로 바꿔 쓰세요) */
const NOTES = [ // Chapter 1(Day 1~10) ~ Chapter 10(Day 91~100) 각 1개
  '첫 Chapter에 온 걸 환영해요! 처음엔 입이 잘 안 떨어지는 게 당연해요. 완벽하게 외우려고 하지 말고, 하루에 한 문장만 소리 내 본다는 마음으로 시작해요.',

/* 사전·사후 말하기 테스트 — 온보딩에서 고른 학습 목적에 맞는 대화 5턴
   상대방 질문(q)에 내가 대답(en/ko). 대답은 이 과정에서 배울 표현 패턴으로 만듦 */
const TEST_SETS = {
  travel: { title: '식당에서 주문하기', turns: [
    [['Hi! Can I help you?', '안녕하세요! 도와드릴까요?'], "I'm looking for a table for two.", '두 명 자리를 찾고 있어요.'],
    [['What would you like?', '뭘로 드릴까요?'], "I'd like the steak, please.", '스테이크로 주세요.'],
    [['Anything to drink?', '음료는요?'], 'Can I get a glass of water?', '물 한 잔 주시겠어요?'],
    [['How is everything?', '음식은 괜찮으세요?'], "I'm happy with the food.", '음식이 마음에 들어요.'],
    [["Here's your bill.", '계산서 여기 있습니다.'], 'May I pay by card?', '카드로 계산해도 될까요?'],
  ] },
  daily: { title: '친구와 일상 대화', turns: [
    [['Hey! Where are you?', '야! 어디야?'], "I'm at a café.", '나 카페에 있어.'],
    [['What are you doing there?', '거기서 뭐 해?'], "I'm waiting for my friend.", '친구 기다리고 있어.'],
    [['What do you do for fun these days?', '요즘 뭐 하면서 놀아?'], "I'm into hiking.", '나 등산에 빠져 있어.'],
    [['What are you doing this weekend?', '이번 주말에 뭐 해?'], "I'm going to see a movie.", '영화 볼 거야.'],
    [["Let's meet tomorrow!", '내일 만나자!'], "I'm excited to see you.", '너 만날 생각에 신나.'],
  ] },
  business: { title: '회사 동료와 대화', turns: [
    [['Where are you now?', '지금 어디세요?'], "I'm at the office.", '사무실에 있어요.'],
    [['Can we talk now?', '지금 얘기할 수 있어요?'], "Sorry, I'm in a meeting.", '죄송해요, 회의 중이에요.'],
    [['What are you working on?', '무슨 일 하고 계세요?'], "I'm working on the report.", '보고서 작업 중이에요.'],
    [['When can you send it?', '언제 보내줄 수 있어요?'], "I'll send it tomorrow.", '내일 보낼게요.'],
    [['Are you free this afternoon?', '오늘 오후에 시간 있어요?'], "I'm free to meet at three.", '세 시에 만날 수 있어요.'],
  ] },
  family: { title: '가족과 영상통화', turns: [
    [['Mom, where are you?', '엄마, 어디야?'], "I'm at home.", '엄마 집에 있어.'],
    [['What are you doing?', '뭐 하고 있어?'], "I'm busy with dinner.", '저녁 준비하느라 바빠.'],
    [['Can you play with me?', '나랑 놀아줄 수 있어?'], "Let's play after dinner.", '저녁 먹고 놀자.'],
    [["I'm so hungry!", '나 너무 배고파!'], "I'll get you a snack.", '간식 가져다줄게.'],
    [['Did you have a good day?', '오늘 좋은 하루 보냈어?'], 'I feel great today.', '오늘 기분 정말 좋아.'],
  ] },
  self: { title: '영어 스터디에서 내 이야기', turns: [
    [['Why are you learning English?', '왜 영어를 배워요?'], 'I want to travel alone.', '혼자 여행하고 싶어서요.'],

    [["What's your goal this year?", '올해 목표가 뭐예요?'], "I'm planning to read twenty books.", '책 스무 권 읽을 계획이에요.'],
    [['See you next week!', '다음 주에 봐요!'], "I'm looking forward to it.", '정말 기대돼요.'],

  culture: { title: '친구와 영화 이야기', turns: [

/* 시연용 서툰 대답: 앞쪽 단어 몇 개만 */
const fakeTry = en => { const w = en.replace(/[.?!]$/, '').split(' '); return w.slice(0, Math.max(1, Math.ceil(w.length / 2))).join('... ') + '...'; };
function testItems(purpose) {
  const set = TEST_SETS[purpose] || TEST_SETS.daily;
  return { title: set.title, items: set.turns.map(([q, en, ko], i) => ({ id: `${purpose}${i + 1}`, q: { en: q[0], ko: q[1] }, en, ko, fake: fakeTry(en) })) };
}

/* =========================================================

const COURSE = [

      { id: 'd1s3', en: "I'm at the gym.",     ko: '나 헬스장에 있어.', key: 'gym' },
      { id: 'd1s4', en: "I'm at the airport.", ko: '나 공항이야.',      key: 'airport' },
      { id: 'd1s5', en: "I'm at a café.",      ko: '나 카페에 있어.',   key: 'café' },
      { id: 'd1s6', en: "I'm at the office.",  ko: '나 사무실에 있어.', key: 'office', dlg: 0 },

    ],
    dialogues: [
      { situation: '현재 위치를 확인하는 상황', a: { en: 'Where are you right now?', ko: '지금 어디야?' }, b: 'd1s6' },
      { situation: '약속 장소에 도착했는지 확인하는 상황', a: { en: 'Did you make it?', ko: '도착했어?' }, b: 'd1s7' },
    ],
    places: ['the park', 'the hotel', 'the station', 'the beach', 'the hospital', 'the bank', 'church'],
    rule(rest) {
      if (/^the (home|work)\b/.test(rest)) return { cls: 'warn', msg: `home·work 앞에는 the를 빼요 → I’m at ${rest.replace('the ', '')}.` };

      if (!/^(the|a|an|my|your|his|her|our|their)$/.test(first) && !['home', 'work', 'school', 'church'].includes(first))

  },
  {
    day: 2, pattern: "I'm in ~", hlText: "I'm in", meaning: '나 ~(안)에 있어 / ~ 상태야',

    lecture: 'Day 2. I’m in ~ 나 ~(안)에 있어 / ~ 상태야',
    tip: '‘in’은 어떤 공간 ‘안’에 있거나, 어떤 ‘상태’에 빠져 있을 때 써요. at은 지점, in은 공간·상태!',

function levelModal() {
  const n = learnedCnt(), cur = eggStage(n);
  const el = document.createElement('div'); el.className = 'modal'; el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `<div class="msheet fade"><div class="row" style="justify-content:space-between;margin-bottom:4px"><div class="h2" style="font-size:19px">레벨 안내</div><button class="iconbtn plain" style="width:36px;height:36px" onclick="this.closest('.modal').remove()" aria-label="닫기">${IC.x}</button></div>
    <p class="sub small" style="margin-bottom:14px">왕초보 영어회화 표현 100개를 모두 익히면 계란이 병아리로 깨어나요. 그다음부터는 다음 프로그램을 완주할 때마다 한 단계씩 자라요.</p>
    ${LEVELS.map((l, i) => `<div class="lvrow ${i === cur ? 'cur' : i > cur ? 'lock' : ''}"><span class="lvart">${charArt(i)}</span><span style="flex:1"><span class="small" style="color:var(--orange-d);font-weight:700">Lv.${i + 1}</span><div style="font-weight:700;font-size:17px">${l.name} · ${l.char}</div><div class="small sub">${l.need}</div>${i === 0 && cur === 0 ? `<div class="bar thin" style="margin-top:8px;max-width:160px"><i style="width:${Math.max(2, n / CONFIG.totalExpressions * 100)}%"></i></div>` : ''}</span>${i === cur ? '<span class="ubadge done">지금 레벨</span>' : i < cur ? `<span class="ubadge done">${IC.chk}</span>` : `<span class="ubadge">${LOCK_SM}</span>`}</div>`).join('')}
    ${cur === 0 ? `<p class="small sub" style="text-align:center;margin-top:12px">표현 <b style="color:var(--orange-d)">${nextLevelLeft(n)}개</b>만 더 익히면 병아리가 깨어나요 (${n}/${CONFIG.totalExpressions})</p>` : ''}</div>`;
  $('#app').appendChild(el);
}

let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text, lang = 'en-US', rate = .88) {
  if (!('speechSynthesis' in window)) return;
  const ss = window.speechSynthesis;
  if (!voices.length) loadVoices();
  const u = new SpeechSynthesisUtterance(String(text).replace(/’/g, "'"));
  u.lang = lang; u.rate = rate; u.volume = 1;
  const v = voices.find(v => v.lang === lang && /Samantha|Google|Natural|Premium|Enhanced/.test(v.name)) || voices.find(v => v.lang === lang) || voices.find(v => v.lang && v.lang.replace('_', '-').startsWith(lang.slice(0, 2)));
  if (v) u.voice = v;
  const busy = ss.speaking || ss.pending;
  try { if (busy) ss.cancel(); ss.resume(); } catch (e) {}
  // iOS Safari는 버튼을 누른 그 순간에 바로 speak해야 소리가 나요 → 기본은 즉시 재생
  if (busy && !/iPhone|iPad|Macintosh.*Safari/.test(navigator.userAgent)) setTimeout(() => ss.speak(u), 60); else ss.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function stopSpeech() { try { speechSynthesis.cancel(); } catch (e) {} if (rec) { try { rec.abort(); } catch (e) {} rec = null; } }
function listen(target, onInterim, onFinal, onErr) {
  if (!SR) { onErr('unsupported'); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
  let latest = '', alts = [], errored = false;
  rec.onresult = e => {
    let txt = ''; for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    latest = txt; onInterim(txt);
    const last = e.results[e.results.length - 1];
    if (last.isFinal) alts = Array.from(last).map(a => a.transcript);
  };
  rec.onerror = e => { errored = true; onErr(e.error); };
  rec.onend = () => {
    rec = null; if (errored) return;
    const cands = alts.length ? alts : [latest];
    const best = cands.sort((a, b) => wscore(b, target) - wscore(a, target))[0] || '';
    onFinal(best);
  };
  rec.start();
}

function quizIntro(st) { stopSpeech(); if (st > 0) toast(`${st + 1}단계 · ${STAGES[st].name}`); startStage(st); }

function hintOf(en) { return en.split(' ').map(w => w.replace(/[A-Za-zÀ-ÿ']+/g, m => m[0] + m.slice(1).replace(/[^']/g, '_'))).join(' '); }
function startStage(st) {
  L.phase = 'quiz';

/* 한 바퀴가 끝나면 틀린 문장만 모아 다음 바퀴로 — 모두 맞힐 때까지 */
function nextRound() {
  Z.items = shuffle(Z.missed); Z.missed = []; Z.i = 0; Z.round++;
  render(`<div>${fhead((Z.st + (Z.total - Z.items.length) / Z.total) / STAGES.length * 100, '')}<div class="pad" style="text-align:center;padding-top:60px">

    <button class="btn" onclick="stageQ()">계속하기</button></div></div>`, { noTabs: true });
}
function stageQ() {
  const s = Z.items[Z.i], st = Z.st;
  let keys = L.c.sentences.map(x => x.key); if (keys.length < 4) keys = [...new Set([...keys, ...COURSE.flatMap(c => c.sentences.map(x => x.key))])];
  const solved = Z.total - Z.items.length + Z.i;
  const base = { sid: s.id, target: s.en, ko: s.ko, full: s.en, pct: (st + 1 + solved / Z.total) / (STAGES.length + 1) * 100, tag: Z.round > 1 ? '틀린 예문 다시 보기' : null,
    cnt: Z.round > 1 ? `${Z.round}바퀴 ${Z.i + 1}/${Z.items.length}` : `${Z.i + 1}/${Z.items.length}`,
    chip: `<span class="stepchip">${st + 1}단계 <em>${STAGES[st].name}</em></span>`,
    onAnswer: (ok, sp) => { const h = H(); if (sp) h.speak++; if (ok) master(s.id); if ((!ok || Q.hinted) && !Z.missed.includes(s)) Z.missed.push(s); save(); },
    onNext: () => { Z.i++; if (Z.i < Z.items.length) return stageQ(); if (Z.missed.length) { Z.items = shuffle(Z.missed); Z.missed = []; Z.i = 0; Z.round++; return stageQ(); } if (st < STAGES.length - 1) return quizIntro(st + 1); finishLearn(); } };
  let cfg;

    const a = s.dlg !== undefined ? L.c.dialogues[s.dlg].a : (s.ask || L.c.ask || DEFAULT_ASK);

      prompt: chatHtml(a.en, a.ko, `<div class="lbl">이렇게 대답해 보세요</div><div class="kk">${pretty(s.ko)}</div>`) };
  }

}

}

function checkSentence(raw, c) {
  const s = raw.trim(), n = norm(s), pre = norm(c.hlText);
  if (!s || n === pre || n === "i'm") return { cls: 'err', msg: '문장을 완성해 주세요.' };
  if (/[ㄱ-ㅎ가-힣]/.test(s)) return { cls: 'err', msg: '한글 대신 영어 단어로 써볼까요?' };
  if (!new RegExp('^' + pre + '\\b').test(n)) return { cls: 'err', msg: `“${pretty(c.hlText)} ~”으로 시작해 볼까요?` };
  const rest = n.slice(pre.length).trim();
  if (!rest) return { cls: 'err', msg: '문장을 완성해 주세요.' };
  if (/^(in|on|at|to|into) /.test(rest)) return { cls: 'warn', msg: '전치사가 두 번 들어갔어요. 뒤에 오는 말만 써보세요.' };
  const r = c.rule && c.rule(rest); if (r) return r;
  if (!/[.!]$/.test(s)) return { cls: 'ok', msg: '좋아요! 끝에 마침표(.)를 붙이면 완벽해요.' };
  return { cls: 'ok', msg: '자연스러운 문장이에요! 소리 내서 한 번 읽어보세요.' };
}

  const rec = { kind: MS.kind, date: today(), title: MS.scn.title, used: MS.used, total: MS.turns.length, lines: MS.log.map(l => ({ q: l.q.en, qk: l.q.ko, a: l.a, ok: l.ok, right: l.right })) };
  S.recs.push(rec); if (MS.kind === 'mission') S.demoMission = false; if (MS.session) { S.talkDone = S.talkDone || {}; S.talkDone[MS.session] = true; } save();
  const words = rec.lines.reduce((a, l) => a + (l.a ? l.a.split(' ').length : 0), 0);
  const pw = prev ? prev.lines.reduce((a, l) => a + (l.a ? l.a.split(' ').length : 0), 0) : 0;
  render(`<div class="donewrap" style="padding-top:56px">
    <div class="flame" style="background:#E8F3FE;color:var(--orange-d)">${IC.mic.replace('<svg', '<svg width="46" height="46"')}</div>
    <div class="h1" style="margin-top:18px">대화를 끝까지 해냈어요!</div>
    <p class="sub" style="margin-top:6px">${MS.session ? `Chapter ${MS.session} 완료! ${MS.session < MAP_COUNT ? `이제 Chapter ${MS.session + 1}이 열렸어요.` : '100일 여정을 모두 마쳤어요.'}` : MS.scn.title}</p>
    <div class="mres"><div><b>${rec.used}/${rec.total}</b><small>배운 표현으로 대답</small></div><div><b>${words}</b><small>내가 말한 단어</small></div></div>
    ${prev ? `<div class="mcmp"><span class="small sub">지난 대화 연습보다</span><b>${words - pw >= 0 ? '+' : ''}${words - pw}단어</b> 더 말했어요</div>` : ''}
    <button class="btn ghost sm" style="margin-top:16px;width:auto;padding:10px 18px" onclick="playRec(${S.recs.length - 1})">${IC.spk.replace('<svg', '<svg width="18" height="18"')} 내 대화 다시 듣기</button>
    <div class="spacer"></div>
    ${MS.session === MAP_COUNT ? '<button class="btn" onclick="App.graduate()">졸업하기</button>' : `<button class="btn" onclick="App.go('home')">홈으로</button>`}
    <button class="link" onclick="App.go('record')">성장 기록 보기</button>
  </div>`, { noTabs: true });
}
function playRec(i) {
  const r = S.recs[i]; if (!r) return;
  const txt = r.lines.map(l => l.a || '').filter(Boolean).join('. ');
  if (!txt) return toast('이때는 대답하지 못했어요');
  say(txt, 'en-US', .8);
}
/* 성장 기록 */
function testCard() {
  const pre = S.tests && S.tests.pre, post = S.tests && S.tests.post, done = learnedCnt() >= CONFIG.totalExpressions;
  if (!pre) return `<div class="tcard"><b>시작 전 말하기 기록</b><p class="small sub" style="margin-top:4px">사전 테스트를 하지 않았어요.</p><button class="btn ghost sm" style="margin-top:10px" onclick="App.preTestAgain()">지금 기록하기</button></div>`;
  return `<div class="tcard"><div class="row" style="justify-content:space-between"><b>말하기 테스트</b><span class="small sub">같은 ${pre.items.length}문장</span></div>
    <div class="tcmp sm"><div><small>시작 전 · ${fmtMD(pre.date)}</small><b>${testScore(pre)}%</b></div><span class="evoarr">→</span><div class="now"><small>${post ? `100일 후 · ${fmtMD(post.date)}` : '100일 후'}</small><b>${post ? testScore(post) + '%' : '?'}</b></div></div>
    ${post ? `<button class="btn sm" onclick="renderTestResult()">녹음 나란히 들어보기</button>`
      : done ? `<p class="small sub" style="text-align:center;margin-bottom:10px">100일 여정을 마쳤어요! 같은 문장으로 다시 말해볼까요?</p>
      <button class="btn sm" onclick="App.postTest()">사후 테스트</button>` : ''}</div>`;
}
function growthHtml() {
  const recs = S.recs || [];
  const tag = k => ({ mission: '대화 연습', apply: '맵 활용', free: '자유연습' })[k] || '대화';
  const list = [...recs].reverse().map(r => { const i = recs.indexOf(r); return `<div class="recrow"><span class="rtag ${r.kind}">${tag(r.kind)}</span><span style="flex:1;min-width:0"><b>${r.title}</b><small>${fmtMD(r.date)} · 배운 표현 ${r.used}/${r.total}</small></span><button class="spk sm" onclick="playRec(${i})">${IC.spk}</button></div>`; }).join('');
  return `<div class="row" style="justify-content:space-between"><b>나의 말하기 성장</b><span class="small sub">대화 ${recs.length}개</span></div>
    ${testCard()}
    <div class="row" style="gap:10px;margin:12px 0 4px"><div class="gstat"><small>말할 수 있게 된 문장</small><b>${S.mastered.length}문장</b></div><div class="gstat"><small>완료한 대화 연습</small><b>${missionsDone()}회</b></div></div>
    ${list ? `<div class="small sub" style="font-weight:600;margin:14px 0 4px">지금까지 대화</div>${list}` : ''}`;
}

/* =========================================================
   이벤트
   ========================================================= */
const App = {
  go, toast, exit: exitFlow, flow: startFlow,
  node(d, id) {
    const stt = nodeState(d, id);
    if (stt === 'locked') return toast(d === curUnit() ? '앞 단계를 먼저 마쳐주세요' : '이전 표현을 먼저 끝내요');
    if (id === 'review' && !reviewCnt()) {
      if (stt === 'cur') { U(d).review = true; save(); renderHome(); return toast('오늘 복습할 문장이 없어요. 바로 강의로!'); }
      return toast('오늘 복습은 모두 끝났어요');
    }
    startFlow(id, d);
  },
  testMic() {
    if (T.rec) return;
    const it = T.items[T.i]; T.rec = true; T.heard = ''; T.audio = null; drawTest();
    if (!CONFIG.fakeMic && SR) {
      AREC.start();
      listen(it.en, x => { const l = $('#tLive'); if (l) l.textContent = x; },
        x => { AREC.stop().then(a => { T.audio = a; T.heard = x.trim(); T.rec = false; drawTest(); }); },
        () => { AREC.stop(); T.rec = false; drawTest(); toast('잘 안 들렸어요. 다시 눌러 말해보세요'); });
      return;
    }
    const w = it.fake.split(' '); let k = 0; // 시연: 서툰 대답을 말한 것처럼
    const tm = setInterval(() => { const l = $('#tLive'); if (!l) { clearInterval(tm); T.rec = false; return; } k++; T.heard = w.slice(0, k).join(' '); l.textContent = T.heard;
      if (k >= w.length) { clearInterval(tm); T.rec = false; drawTest(); } }, 380);
  },
  testNext(skip) {
    if (T.rec) return;
    const it = T.items[T.i], said = skip ? '' : T.heard, g = said ? grade(said, it.en, true) : { ok: false, score: 0 };
    T.ans.push({ id: it.id, q: it.q, ko: it.ko, en: it.en, said, ok: g.ok, score: Math.round(g.score * 100) / 100, audio: skip ? null : T.audio });
    T.i++; T.heard = ''; T.audio = null;
    if (T.i < T.items.length) { drawTest(); setTimeout(() => { const it = T && T.items[T.i]; if (it) say(it.q.en); }, 300); return; }
    App.testFinish();
  },
  /* 발표·시연용: 남은 문제를 건너뛰고 바로 완료 (시연 모드면 서툰 대답으로 채움) */
  testSkipAll() {
    if (T.rec) return;
    while (T.i < T.items.length) { const it = T.items[T.i]; const said = CONFIG.fakeMic ? (T.kind === 'post' ? it.en : it.fake) : '';
      const g = said ? grade(said, it.en, true) : { ok: false, score: 0 };
      T.ans.push({ id: it.id, q: it.q, ko: it.ko, en: it.en, said, ok: g.ok, score: Math.round(g.score * 100) / 100, audio: null }); T.i++; }
    App.testFinish();
  },
  testFinish() {
    S.tests[T.kind] = { date: today(), title: T.title, items: T.ans }; save();
    if (T.kind === 'post') { T = null; return renderTestResult(); }
    T.finished = true; drawTest(false);
  },
  testDone() { T = null; if (!S.onboarded) return App.ob(4); go('record'); },
  postTest() { stopSpeech(); if (!S.tests.pre) return toast('시작 전 테스트 기록이 없어요'); T = newTest('post'); drawTest(); },
  preTestAgain() { stopSpeech(); T = newTest('pre'); drawTest(); },
  map() { stopSpeech(); go('home'); },
  stop(d) {
    const c = courseDay(d); if (!c) return;
    if (d === curUnit()) return App.today(true); // 하루에 여러 Day를 이어서 해도 됨
    if (!unitDone(d)) return toast(pendingTalk() ? `Chapter ${pendingTalk()} 회화 연습을 먼저 해요` : `Day ${d}는 앞의 날을 걸어간 뒤에 열려요`);
    sheet(`<div class="row" style="justify-content:space-between"><span class="gtag">Chapter ${mapOf(d)} · Day ${d}</span>${closeBtn}</div>
      <div class="h2" style="margin-top:12px">${hl(c.pattern)}</div><div class="sub" style="margin-top:2px">${c.meaning}</div>
      <button class="btn" style="margin-top:16px" onclick="this.closest('.modal').remove();App.study(${d})">이 표현 다시 공부하기</button>`);
  },
  /* 10개 표현마다 열리는 회화 연습 */
  /* 시연: Chapter 1을 Day 10까지 모두 끝낸 상태로 만들고, 열린 회화 연습을 보여줌 */
  talkDemo() {
    delete S.talkDemo; S.talkDone = {}; S.seen.note1 = 1; App.jumpDay(MAP_SIZE + 1); // 회화 연습은 아직 안 한 상태로 (쪽지 팝업은 생략)
    const t = document.querySelector('#chap1 .jstop.talk.cur'), v = $('#view');
    if (t) { const r = t.getBoundingClientRect(), vr = v.getBoundingClientRect(); v.scrollTop += r.top - vr.top - (v.clientHeight - r.height) / 2; }
    toast('Day 10까지 완료! 회화 연습을 해봐요');
  },
  talk(m) {
    if (!talkOpen(m)) return toast(`Chapter ${m}의 표현 10개를 모두 배우면 회화 연습이 열려요`);
    const mine = myScenarios(); MS = { kind: 'mission', pick: mine[(m - 1) % mine.length].id, session: m }; renderMissionIntro();
  },
  practice(id) { MS = { kind: missionsOpen() > missionsDone() ? 'mission' : 'free', pick: id }; beginMission(); },
  preview() { const d = curUnit(); if (d) startFlow('preview', d); },
  today(ahead) { const d = curUnit(); if (!d) return; if (ahead) H().doneUnit = null; startFlow('today', d); },
  openUnit(d) { if (!units().some(c => c.day === d)) return; if (d !== curUnit() && !unitDone(d)) return toast('이전 표현을 먼저 끝내요'); openDay = openDay === d ? null : d; renderHome(); },
  reviewNow() { if (!reviewCnt()) return toast('오늘 복습할 문장이 없어요'); startFlow('review', curUnit() || undefined); },
  how() { howModal(); },
  study(d) { stopSpeech(); startFlow('study', d); },
  toggleCh(m) { openCh.has(m) ? openCh.delete(m) : openCh.add(m); const y = $('#view').scrollTop; renderWords(); $('#view').scrollTop = y; },
  toggleW(d) { openW.has(d) ? openW.delete(d) : openW.add(d); const y = $('#view').scrollTop; renderWords(); $('#view').scrollTop = y; },
  ob(n) { OB.step = n; renderOB(); },
  obDone() {
    S.onboarded = true; S.purposes = OB.purposes.slice(); S.goalText = (OB.goalText || '').trim(); S.alarms = OB.alarms.slice(); S.alarm = OB.alarms[0] || '07:00'; S.start = today(); ensureSeeds(); save();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(p => { S.notif = p === 'granted'; save(); });
    tab = 'home'; App.jumpDay(4); S.demoMission = true; save(); go('home'); // 프로토타입: Day 1~3 완료 + 회화 연습 열린 상태로 시작
  },
  pick(i) {
    if (Q.done) return; const w = Q.cfg.chips[i], ok = w === Q.cfg.target;
    $('#chip' + i).classList.add(ok ? 'ok' : 'no');
    if (!ok) Q.cfg.chips.forEach((c, j) => { if (c === Q.cfg.target) $('#chip' + j).classList.add('ok'); });
    feedback(ok, w, false, null);
  },
  submitType() {
    if (Q.done) return; const v = $('#ans').value; if (!v.trim()) { toast('영어로 입력해 주세요'); return; }
    const r = grade(v, Q.cfg.target, false); feedback(r.ok, v, false, r);
  },
  giveUp() { if (!Q.done) feedback(false, '', false, null); },
  mic() {
    if (Q.done) return;
    if (CONFIG.fakeMic || !SR) return App.fakeMic();
    const btn = $('#mic'), lbl = $('#miclbl'), live = $('#live');
    if (rec) { try { rec.stop(); } catch (e) {} return; }
    btn.classList.add('on'); lbl.textContent = '듣고 있어요… 말이 끝나면 다시 눌러도 돼요'; live.textContent = '';
    listen(Q.cfg.target, t => { live.textContent = t; }, t => {
      btn && btn.classList.remove('on');
      if (!t.trim()) { lbl.textContent = '잘 안 들렸어요. 다시 눌러 말해보세요'; return; }
      Q.heard = t; live.textContent = t; lbl.textContent = '다시 말하려면 마이크를 눌러요';
    }, err => {
      btn && btn.classList.remove('on');
      if (err === 'not-allowed' || err === 'service-not-allowed') { toast('마이크 권한이 필요해요. 입력으로 대신할게요'); Q.typing = true; drawQ(); }
      else if (err === 'unsupported') { Q.typing = true; drawQ(); }
      else lbl.textContent = err === 'no-speech' ? '소리가 안 들렸어요. 다시 눌러 말해보세요' : '다시 한 번 눌러 말해보세요';
    });
  },
  fakeMic() {
    const btn = $('#mic'), lbl = $('#miclbl'), live = $('#live');
    if (Q.rec) return;
    Q.rec = true; Q.heard = '';
    btn.classList.add('on'); lbl.textContent = '듣고 있어요…'; live.innerHTML = '';
    const words = String(Q.cfg.target).split(' '); let k = 0;
    const tm = setInterval(() => {
      if (Q.done || !document.getElementById('live')) { clearInterval(tm); Q.rec = false; return; }
      k++; Q.heard = words.slice(0, k).join(' '); live.textContent = Q.heard;
      if (k >= words.length) { clearInterval(tm); Q.rec = false; btn.classList.remove('on'); lbl.textContent = '다시 말하려면 마이크를 눌러요'; }
    }, 380);
  },
  submitSpeech() {
    if (Q.done) return;
    const t = (Q.heard || ($('#live') && !$('#live .ph') ? $('#live').textContent : '')).trim();
    if (!t) return toast('마이크를 누르고 먼저 말해보세요');
    const r = grade(t, Q.cfg.target, true); feedback(r.ok, t, true, r);
  },
  skipAll() {
    stopSpeech(); if (!F) return;
    const step = F.steps[F.i];
    if (step === 'review') {
      R.items.forEach(x => master(x.s.id)); H().review += Math.max(0, R.items.length - R.i);
      R.i = R.items.length - 1; R.first = false; Q.done = true; Q.cfg.onNext(true);
    } else if (step === 'learn') {
      L.c.sentences.forEach(x => master(x.id)); finishLearn();
    }
  },
  retry() { const cfg = Q.cfg; const typing = Q.typing; showQ(cfg); Q.typing = typing; drawQ(); },
  qnext(ok) { stopSpeech(); Q.cfg.onNext(ok); },
  openLecture(d) { const u = CONFIG.lectureUrl(d); if (u && u !== '#') window.open(u, '_blank'); else toast('실제 강의 링크로 연결돼요 (CONFIG.lectureUrl)'); },
  afterReview() { studying = true; if (F && F.steps[F.i + 1] && F.steps[F.i + 1] !== 'done') { F.i++; runStep(); } else { const d = curUnit(); if (d) startFlow('today', d); else go('home'); } },
  toQuiz() { H().lecture = true; stopSpeech(); nextStep(); },
  lectureDone() { H().lecture = true; const d = curDay(); L = { d, c: courseDay(d), i: 0, fromLecture: true }; drawEx(); },
  playDlg(i) {
    const g = L.c.dialogues[i], b = sentById(g.b);
    say(g.a.en); const u = new SpeechSynthesisUtterance(b.en); u.lang = 'en-US'; u.rate = .88; u.pitch = .8;
    setTimeout(() => speechSynthesis.speak(u), 50);
  },
  quizIntro, stage: startStage,
  addWord(w) {
    const i = M.focus || 0, el = $('#m' + i); let v = el.value.replace(/\s+$/, '');
    v = v.replace(/[.!]$/, ''); el.value = `${v} ${w}.`.replace(/\s+/g, ' '); M.vals[i] = el.value; document.querySelector('.modal.wordm')?.remove(); el.focus(); toast(`‘${w}’를 ${i + 1}번째 문장에 넣었어요`);
  },
  addPlace(p) { const i = M.focus, el = $('#m' + i); el.value = `${M.c.hlText} ${p}.`; M.vals[i] = el.value; el.focus(); },
  checkMine() { M.res = M.vals.map(v => checkSentence(v, M.c)); M.res.forEach((r, i) => { const el = $('#r' + i); el.className = 'res ' + r.cls; el.textContent = r.msg; }); },
  saveMine() {
    S.mine[M.d] = M.vals.slice(); H().mineDone = true; M = null; nextStep();
  },
  graduate: renderGraduate,
  notif() {
    if (!('Notification' in window)) return toast('이 브라우저는 알림을 지원하지 않아요');
    Notification.requestPermission().then(p => { S.notif = p === 'granted'; save(); if (S.notif) new Notification('영어 공부할 시간이에요', { body: `매일 ${(S.alarms || [S.alarm]).map(fmtAlarm).join(', ')}에 알려드릴게요.` }); go('settings'); });
  },
  jumpDay(n) {
    const t = today();
    for (let d = 1; d < n; d++) {
      const on = addDays(t, -(n - d));
      S.units[d] = { review: true, lecture: true, learn: true, apply: true, redo: true };
      S.learned[d] = { on }; if (d < n - 1) S.learned[d].reviewed = addDays(on, 1); // 어제 배운 Day만 오늘 복습에 나옴
      const DEMO_W = { d1s3: [6, 3], d1s7: [5, 1], d2s4: [7, 3], d2s5: [8, 4], d2s1: [5, 1], d3s3: [6, 2], d3s7: [5, 2] };
      const DEMO_MINE = { 1: ["I'm at the park.", "I'm at the station.", "I'm at my friend's house."], 2: ["I'm in the kitchen.", "I'm in a good mood.", "I'm in a hurry."], 3: ["I'm interested in history.", "I'm interested in golf."] };
      if (!S.stat) S.stat = {};
      (courseDay(d) ? courseDay(d).sentences : []).forEach(x => { const w = DEMO_W[x.id]; S.stat[x.id] = w ? { n: w[0], w: w[1] } : { n: 4, w: 0 }; if (!w || w[1] < 2) master(x.id); });
      if (DEMO_MINE[d] && !(S.mine[d] || []).some(x => norm(x) !== norm(courseDay(d).hlText))) S.mine[d] = DEMO_MINE[d];
      if (!S.reps) S.reps = {}; S.reps[d] = Math.max(S.reps[d] || 0, 1 + Math.max(0, n - d - 1));
      S.hist[on] = Object.assign(S.hist[on] || {}, { review: 3, neu: 7, lecture: true, learnDone: true, complete: true, doneUnit: d });
      S.sec[on] = Math.max(S.sec[on] || 0, 1500);
    }
    S.units[n] = { review: false, lecture: false, learn: false };
    const wrongIds = Object.keys(S.stat || {}).filter(id => S.stat[id].w >= 2 && sentAny(id) && sentAny(id).c.day < n - 1).slice(0, 2);
    S.reviewWrong = { date: addDays(t, -1), ids: wrongIds }; // 어제 복습에서 틀린 문장 (시연)
    if (S.hist[t]) S.hist[t].doneUnit = null;
    S.start = addDays(t, -(n - 1)); save(); toast(`${n}일차로 이동했어요`); go('home');
  },
  nextDay() { S.offset++; save(); toast(`${fmtMD(today())}로 이동했어요`); go('home'); },
  reset() { if (!confirmReset()) return; try { localStorage.removeItem(KEY); } catch (e) {} S = JSON.parse(JSON.stringify(DEF)); OB.step = 0; go('home'); },
};
function confirmReset() { if (App._r) { App._r = false; return true; } App._r = true; toast('한 번 더 누르면 모든 기록이 지워져요'); setTimeout(() => App._r = false, 3000); return false; }
window.App = App;

ensureSeeds();
go('home');
